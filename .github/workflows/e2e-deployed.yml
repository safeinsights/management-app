# The deployed-environment e2e suite (tests/deployed) against a real environment. Three ways in:
#
#   - workflow_dispatch: QA runs any project against any target from the Actions tab.
#   - schedule: the full project against Dev every night.
#   - repository_dispatch (event type `deployed-e2e`): whatever deploys an environment (the
#     CodePipeline, a Jenkins stage, a laptop) calls the GitHub API after the deploy, e.g.
#       gh api repos/safeinsights/management-app/dispatches \
#         -f event_type=deployed-e2e \
#         -F 'client_payload[target]=staging' -F 'client_payload[project]=smoke' \
#         -F 'client_payload[expected_release]=v1.2.3'
#     For a CodePipeline test action instead, see buildspec.e2e-deployed.yml.
#
# One run per target at a time: the three shared accounts and the enclave cannot be driven by two
# runs. The credential file is one repository secret, E2E_DEPLOYED_ENV, holding the contents of
# .env.deployed (tests/deployed/env.deployed.sample); bin/e2e-deployed writes it to disk and never
# prints it. It is never exposed to pull_request-triggered code: this workflow has no pull_request
# trigger and PR previews are reached through dispatches only.
name: E2E deployed

on:
    workflow_dispatch:
        inputs:
            target:
                description: 'Environment (qa, staging, production, demo) or pr<N> for a PR preview'
                required: true
                default: qa
                type: string
            project:
                description: 'smoke is safe everywhere; full creates studies and waits for the enclave'
                required: true
                default: smoke
                type: choice
                options: [smoke, full]
            expected_release:
                description: 'The tag or short SHA the about page must show (optional)'
                required: false
                default: ''
                type: string
    schedule:
        # Nightly full run against Dev, after the enclave's own nightly work and before the US morning.
        - cron: '0 8 * * *'
    repository_dispatch:
        types: [deployed-e2e]

permissions: {}

concurrency:
    group: e2e-deployed-${{ inputs.target || github.event.client_payload.target || 'qa' }}
    cancel-in-progress: false

jobs:
    e2e-deployed:
        timeout-minutes: 120
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            E2E_TARGET: ${{ inputs.target || github.event.client_payload.target || 'qa' }}
            E2E_PROJECT: ${{ inputs.project || github.event.client_payload.project || 'full' }}
            E2E_EXPECTED_RELEASE: ${{ inputs.expected_release || github.event.client_payload.expected_release || '' }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
                  cache: 'pnpm'
            - name: pnpm install
              run: pnpm install --frozen-lockfile
            - name: install chromium
              run: pnpm exec playwright install --with-deps --only-shell chromium
            - name: run the ${{ env.E2E_PROJECT }} project against ${{ env.E2E_TARGET }}
              env:
                  E2E_DEPLOYED_ENV: ${{ secrets.E2E_DEPLOYED_ENV }}
              run: ./bin/e2e-deployed --target "$E2E_TARGET" --project "$E2E_PROJECT"
            - name: upload the report, traces and videos
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: e2e-deployed-${{ env.E2E_TARGET }}-${{ env.E2E_PROJECT }}-${{ github.run_id }}
                  path: |
                      test-results/deployed
                      test-results/deployed-html
                  retention-days: 30
                  if-no-files-found: ignore
            - name: summary
              if: always()
              run: |
                  echo "## E2E deployed: ${E2E_PROJECT} against ${E2E_TARGET}" >> "$GITHUB_STEP_SUMMARY"
                  if [ -f test-results/deployed/junit.xml ]; then
                      node -e '
                          const xml = require("fs").readFileSync("test-results/deployed/junit.xml", "utf8")
                          const n = (name) => (xml.match(new RegExp(`<testsuites[^>]*\\b${name}="(\\d+)"`)) || [])[1] ?? "?"
                          console.log(`tests ${n("tests")}, failures ${n("failures")}, skipped ${n("skipped")}`)
                      ' >> "$GITHUB_STEP_SUMMARY"
                  fi
